name: CI (macOS)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# See test-linux.yml's own identical comment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0

      # Explicit timeout, not Go's own 600s default: a hang here used to
      # surface as a 600s goroutine-dump panic indistinguishable from a
      # real deadlock, on a runner already close to that ceiling with
      # -race (internal/ui alone: ~120s locally, slower on a loaded CI
      # box) — 20m is headroom above the real runtime, not a tolerance
      # for an actual hang.
      - run: go test ./... -race -cover -timeout 20m
