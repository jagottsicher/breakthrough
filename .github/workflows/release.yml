name: release

# Only a "v*.*.*" tag pushed to main triggers this — main is exclusively
# for tagged releases by design, never a direct commit, so a tag
# landing there always means "this is the commit to release".
on:
  push:
    tags:
      - "v*.*.*"

# contents: write is what lets GoReleaser create the GitHub Release and
# upload its assets — see goreleaser.com/ci/actions, the current
# (checked, not guessed) recommended setup this workflow follows.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs the full history for its changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Regenerate callgraph
        run: |
          callvis_dir="$(mktemp -d)"
          git clone --depth 1 https://github.com/ofabry/go-callvis.git "$callvis_dir/go-callvis"
          cd "$callvis_dir/go-callvis"
          # go-callvis walks callgraph.Graph.Nodes (a map) and collects
          # dotAttrs into another map without sorting either, so the
          # generated .dot/.svg is not reproducible between two otherwise
          # identical runs -- see .github/callgraph-patches/go-callvis-determinism.patch
          # for the full explanation (the same fix callgraph.yml already
          # applies before its own build of the tool). Without this, a
          # release build regenerates a callgraph.svg that can differ
          # from the one actually committed for this tag, which
          # GoReleaser then refuses to run against ("git is in a dirty
          # state") -- a real, previously-hit failure, not a hypothetical
          # one.
          git apply "$GITHUB_WORKSPACE/.github/callgraph-patches/go-callvis-determinism.patch"
          go get golang.org/x/tools@v0.49.0
          go install .
          cd "$GITHUB_WORKSPACE"
          "$(go env GOPATH)/bin/go-callvis" \
            -focus github.com/jagottsicher/breakthrough/cmd/breakthrough \
            -file docs/images/callgraph \
            -rankdir TB \
            ./...

      - name: Regenerate context index
        run: go run ./cmd/gen-context-index -root . -output docs/code-index.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
