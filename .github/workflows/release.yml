name: release

# Only a "v*.*.*" tag pushed to main triggers this — main is exclusively
# for tagged releases by design, never a direct commit, so a tag
# landing there always means "this is the commit to release".
on:
  push:
    tags:
      - "v*.*.*"

# contents: write is what lets GoReleaser create the GitHub Release and
# upload its assets — see goreleaser.com/ci/actions, the current
# (checked, not guessed) recommended setup this workflow follows.
permissions:
  contents: write

jobs:
  # The test-*.yml workflows only trigger on a push/pull_request against
  # develop — a tag push to main (this workflow's own trigger) never ran
  # them on the actual merge commit being released. gh pr checks on the
  # develop->main release PR shows the *same* check runs as a green,
  # independent confirmation only by coincidence: those are the develop
  # push's own runs for that identical commit SHA, not a fresh run
  # against main. goreleaser needing this job closes that gap: nothing
  # releases without the exact tagged commit passing go vet/lint/test
  # right here, regardless of what already ran (or didn't) on develop.
  test:
    runs-on: ubuntu-latest
    # Only ever reads this repo's own checkout — narrower than the
    # workflow-level `contents: write` the goreleaser job below
    # actually needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0

      # See test-linux.yml's own identical comment for why this is
      # explicit rather than Go's 600s default.
      - run: go test ./... -race -cover -timeout 20m

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # GoReleaser needs the full history for its changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Regenerate callgraph
        run: |
          callvis_dir="$(mktemp -d)"
          git clone https://github.com/ofabry/go-callvis.git "$callvis_dir/go-callvis"
          cd "$callvis_dir/go-callvis"
          # Pinned commit, not upstream's own default-branch HEAD — see
          # callgraph.yml's own identical comment for why.
          git checkout 67a26605e208542065d44b34a28948dde3af8d1c
          # go-callvis walks callgraph.Graph.Nodes (a map) and collects
          # dotAttrs into another map without sorting either, so the
          # generated .dot/.svg is not reproducible between two otherwise
          # identical runs -- see .github/callgraph-patches/go-callvis-determinism.patch
          # for the full explanation (the same fix callgraph.yml already
          # applies before its own build of the tool). Without this, a
          # release build regenerates a callgraph.svg that can differ
          # from the one actually committed for this tag, which
          # GoReleaser then refuses to run against ("git is in a dirty
          # state") -- a real, previously-hit failure, not a hypothetical
          # one.
          git apply "$GITHUB_WORKSPACE/.github/callgraph-patches/go-callvis-determinism.patch"
          go get golang.org/x/tools@v0.49.0
          go install .
          cd "$GITHUB_WORKSPACE"
          "$(go env GOPATH)/bin/go-callvis" \
            -focus github.com/jagottsicher/breakthrough/cmd/breakthrough \
            -file docs/images/callgraph \
            -rankdir TB \
            ./...

      - name: Regenerate context index
        run: go run ./cmd/gen-context-index -root . -output docs/code-index.json

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained PAT with Contents read/write on
          # jagottsicher/homebrew-breakthrough — GITHUB_TOKEN can only
          # write to this repo, not a different one, so the brews:
          # block in .goreleaser.yaml needs its own token.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Builds the apt/rpm repository metadata consumed by
  # pkg.breakthrough.jens-schendel.com and pushes it to the separate
  # jagottsicher/breakthrough-pkg repo (its GitHub Pages source). Runs
  # after goreleaser so the .deb/.rpm assets it downloads already exist
  # on the GitHub release.
  publish-pkg-repo:
    needs: goreleaser
    runs-on: ubuntu-latest
    # Only ever reads from this repo (gh release download) — every
    # write this job does goes to the separate jagottsicher/breakthrough-pkg
    # repo, over its own PAT (PKG_REPO_GITHUB_TOKEN), not GITHUB_TOKEN.
    # Narrower than the workflow-level `contents: write` the goreleaser
    # job above actually needs.
    permissions:
      contents: read
    steps:
      - name: Install repo tooling
        run: sudo apt-get update && sudo apt-get install -y reprepro createrepo-c rpm gnupg

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Belt-and-suspenders against gpg-agent trying to pop a
          # pinentry prompt (which would just hang in CI) when reprepro
          # shells out to gpg to sign the apt Release file — the key
          # itself has no passphrase, but some gpg-agent versions still
          # want an explicit loopback pinentry configured to skip asking.
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          printf '%s\n' \
            '%_signature gpg' \
            '%_gpg_name breakthrough package signing' \
            '%__gpg /usr/bin/gpg' \
            '%__gpg_sign_cmd %{__gpg} gpg --batch --no-armor --digest-algo sha256 --pinentry-mode loopback --passphrase "" -u "%{_gpg_name}" --detach-sign -o %{__signature_filename} %{__plaintext_filename}' \
            > ~/.rpmmacros

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" \
            --repo jagottsicher/breakthrough \
            --pattern '*.deb' --pattern '*.rpm' \
            --dir assets

      - name: Clone breakthrough-pkg
        env:
          PKG_REPO_GITHUB_TOKEN: ${{ secrets.PKG_REPO_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${PKG_REPO_GITHUB_TOKEN}@github.com/jagottsicher/breakthrough-pkg.git" pkg-repo

      - name: Update apt repository
        # Idempotent against a re-tag of the same version (the
        # documented "delete bad tag, fix, re-tag" recovery path in
        # the merge-release skill): reprepro's own behavior on an
        # exact-duplicate include depends on whether the rebuilt file
        # is byte-identical to what's already there, which isn't
        # guaranteed across two separate GoReleaser builds even for
        # the same source commit (embedded build timestamps). Removing
        # each package name first, then including the full set fresh,
        # means this step never depends on that distinction.
        run: |
          cd pkg-repo
          for f in ../assets/*.deb; do
            pkg="$(dpkg-deb -f "$f" Package)"
            reprepro -b apt removefilter stable "Package (== $pkg)" || true
          done
          for f in ../assets/*.deb; do
            reprepro -b apt includedeb stable "$f"
          done
          # reprepro's own distribution index only ever lists the
          # latest version "includedeb" added per package+architecture
          # -- an older version's own .deb is never listed/installable
          # again the moment a newer one replaces it, it just stays on
          # disk in pool/ as dead weight (confirmed: 22MB of apt/ here
          # vs 1.2GB of rpm/, where nothing dropped old versions at
          # all). deleteunreferenced purges exactly that dead weight,
          # with zero change to what's actually installable.
          reprepro -b apt deleteunreferenced

      - name: Update rpm repository
        # Maps each .goreleaser.yaml nfpm arch suffix to the RPM repo
        # directory name real distros expect (armhfp is Fedora/RHEL's
        # own convention for 32-bit ARM hardfloat, matching x86_64/
        # aarch64's own upstream naming, not an arbitrary choice) — a
        # loop over this table instead of one hardcoded glob per arch,
        # so a v0.87.19-style silent drop (linux_armv7.rpm matched
        # neither *_amd64.rpm nor *_arm64.rpm and was never copied in,
        # even though the equivalent .deb made it into the apt repo
        # fine) can't happen again the same way for a future arch.
        run: |
          cd pkg-repo
          declare -A rpm_dirs=(
            [amd64]=x86_64
            [arm64]=aarch64
            [armv7]=armhfp
          )
          # new_rpms collects only files actually (re-)copied this run
          # -- re-signing an rpm already signed by a prior run of this
          # same tag (the "delete bad tag, fix, re-tag" recovery path)
          # is unverified territory for this rpm version, so the safer
          # scope is "only what we just touched", not every file that
          # happens to already be sitting in the directory.
          new_rpms=()
          for suffix in "${!rpm_dirs[@]}"; do
            dir="rpm/stable/${rpm_dirs[$suffix]}"
            mkdir -p "$dir"
            for f in ../assets/*_"$suffix".rpm; do
              [ -e "$f" ] || continue
              dest="$dir/$(basename "$f")"
              if [ -e "$dest" ] && cmp -s "$f" "$dest"; then
                continue # identical to what's already published, skip re-copy/re-sign
              fi
              cp "$f" "$dest"
              new_rpms+=("$dest")
            done
          done
          if [ "${#new_rpms[@]}" -gt 0 ]; then
            rpm --addsign "${new_rpms[@]}"
          fi
          # Unlike apt/reprepro (see "Update apt repository" above),
          # createrepo_c indexes every .rpm file physically present --
          # there is no "newer version replaces older" semantic here,
          # so every version ever copied in stayed installable forever
          # (confirmed: 182 files back to v0.60.1, 1.2GB). Keep only
          # the 3 newest per architecture directory before
          # regenerating metadata -- a real, deliberate reduction in
          # how far back a pinned install can reach, not just garbage
          # collection.
          for dir in rpm/stable/*/; do
            mapfile -t rpm_files < <(find "$dir" -maxdepth 1 -name '*.rpm' -printf '%f\n' | sort -t_ -k2 -V)
            keep=3
            total=${#rpm_files[@]}
            if [ "$total" -gt "$keep" ]; then
              for f in "${rpm_files[@]:0:$((total - keep))}"; do
                rm -f "$dir/$f"
              done
            fi
          done
          for dir in rpm/stable/*/; do
            createrepo_c --update "$dir"
          done

      - name: Commit and push
        run: |
          cd pkg-repo
          git -c user.name="jagottsicher" -c user.email="jagottsicher@gmx.net" add -A
          git -c user.name="jagottsicher" -c user.email="jagottsicher@gmx.net" \
            commit -m "Add ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin HEAD:main
