name: CI (Linux)

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

      # Explicit timeout, not Go's own 600s default: a hang here used to
      # surface as a 600s goroutine-dump panic indistinguishable from a
      # real deadlock, on a runner already close to that ceiling with
      # -race (internal/ui alone: ~120s locally, slower on a loaded CI
      # box) — 20m is headroom above the real runtime, not a tolerance
      # for an actual hang.
      - run: go test ./... -race -cover -timeout 20m
