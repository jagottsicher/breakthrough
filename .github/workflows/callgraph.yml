name: Callgraph

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Regenerate callgraph
        run: |
          go install github.com/ofabry/go-callvis@v0.7.2-0.20251130120951-67a26605e208
          "$(go env GOPATH)/bin/go-callvis" \
            -focus github.com/jagottsicher/breakthrough/cmd/breakthrough \
            -file docs/images/callgraph \
            -rankdir TB \
            ./...

      - name: Verify committed callgraph
        run: git diff --exit-code -- docs/images/callgraph.svg