# GoReleaser v2 configuration — see .github/workflows/release.yml for
# what runs this (a "v*.*.*" tag pushed to main). The target platform
# list and package formats below follow this project's own release design.
#
# Schema verified against the current GoReleaser docs (goreleaser.com)
# at the time this was written, not guessed from training data — the
# config format has changed between major versions (this is a v2
# config; a v1 one looks different in several of these sections, most
# notably archives.formats below, which used to be the singular
# archives.format).
version: 2

project_name: breakthrough

before:
  hooks:
    - go mod tidy
    # Generates the /etc/breakthrough/config the .deb/.rpm packages ship
    # below (see nfpms.contents) straight from the exact same function
    # the running application itself uses to write a fresh user config
    # — see cmd/gen-etc-config's own doc comment for why a generated
    # file here, not a second, hand-copied listing that could drift out
    # of sync with the settings breakthrough actually recognizes.
    #
    # sh -c rather than a bare command: GoReleaser runs a hook's own cmd
    # directly (split on whitespace), with no shell and therefore no
    # redirection support of its own — confirmed live, not just from the
    # docs, by running `goreleaser check` against this file. The docs'
    # own "cmd:/output:" map form for a hook entry, also checked live the
    # same way, turned out to be rejected by before.hooks specifically at
    # the GoReleaser version this was verified against (v2, installed
    # fresh via `go install .../goreleaser/v2@latest`) — "cannot
    # unmarshal !!map into string" — so this stays the plain string form
    # despite the map form existing elsewhere in GoReleaser's own schema.
    - sh -c "mkdir -p .goreleaser-generated && go run ./cmd/gen-etc-config > .goreleaser-generated/etc-breakthrough-config"

builds:
  - id: breakthrough
    main: ./cmd/breakthrough
    binary: breakthrough
    # No CGO anywhere in this project — a deliberate architecture
    # guardrail — CGO_ENABLED=0 is what makes cross-compiling straight
    # from a single Linux runner to every target below possible at all,
    # without needing a C cross-compiler toolchain per platform.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      # freebsd/arm64 is deliberately not a target (this project's own
      # platform list) — only freebsd/amd64 is.
      - goos: freebsd
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.builtBy=goreleaser

archives:
  - id: breakthrough
    formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# .deb/.rpm packages — Homebrew and AUR are explicitly a later step,
# needing a separate tap repo, not part of this first pipeline. Linux
# only, matching the formats themselves.
nfpms:
  - id: breakthrough
    package_name: breakthrough
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    maintainer: jagottsicher <jagottsicher@gmx.net>
    homepage: https://github.com/jagottsicher/breakthrough
    description: >-
      POSIX-friendly, window/menu-based TUI file manager for the
      terminal, inspired by the Windows 3.11 UX.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    # Ships a real, documented starting point for a system-wide setting
    # under /etc/breakthrough — schema verified against the current nfpm
    # docs (nfpm.goreleaser.com), not assumed, the same discipline this
    # project already applies to GoReleaser's own config. Before this,
    # installing the package left /etc/breakthrough not existing at all;
    # nothing here ever created it, and breakthrough itself, running as
    # an ordinary user, has no business writing to it — see
    # config.LoadWithOrigins/Origin for what a value actually sitting
    # there means to a running instance. The user tier
    # (~/.config/breakthrough or $XDG_CONFIG_HOME/breakthrough) and the
    # trash under $XDG_DATA_HOME/breakthrough/trash are unaffected by
    # any of this: both are created lazily by breakthrough itself the
    # first time something is actually written there (see
    # config.SetKey/EnsureUserFile and internal/session.TrashDir), which
    # already works correctly regardless of how breakthrough was
    # installed.
    contents:
      - src: .goreleaser-generated/etc-breakthrough-config
        dst: /etc/breakthrough/config
        file_info:
          mode: 0o644
        # config|noreplace: corresponds to rpm's own %config(noreplace)
        # and is deb's own conffile handling otherwise — an
        # administrator's own edits survive a package upgrade instead of
        # being silently overwritten by a newer template.
        type: config|noreplace
      # An empty directory for a system-wide custom color scheme (see
      # config.SystemColorSchemeDir) — otherwise there would be nowhere
      # on disk documenting that this is even a place breakthrough looks.
      - dst: /etc/breakthrough/colorschemes
        type: dir
        file_info:
          mode: 0o755

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"
      - "^Merge remote-tracking branch"
  groups:
    # Matches this project's own Conventional Commits type list
    # (feat/fix/refactor/docs/chore/test) — not a generic feat/fix/docs/
    # chore list copied from GoReleaser's own example, which uses a
    # different set.
    - title: Features
      regexp: '^feat(\([[:word:]-]+\))?!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^fix(\([[:word:]-]+\))?!?:.+$'
      order: 1
    - title: Refactoring
      regexp: '^refactor(\([[:word:]-]+\))?!?:.+$'
      order: 2
    - title: Documentation
      regexp: '^docs(\([[:word:]-]+\))?!?:.+$'
      order: 3
    - title: Tests
      regexp: '^test(\([[:word:]-]+\))?!?:.+$'
      order: 4
    - title: Other
      order: 999

release:
  github:
    owner: jagottsicher
    name: breakthrough
  prerelease: auto
  mode: replace
  header: |
    ## breakthrough {{ .Tag }}

    POSIX-friendly, window/menu-based TUI file manager for the terminal,
    inspired by the Windows 3.11 UX — built with [tcell](https://github.com/gdamore/tcell)
    and [tview](https://github.com/rivo/tview).

    ### Installing

    Download the archive for your platform below, or grab the `.deb`/`.rpm`
    package if your distribution uses one. Extract and run:

    ```sh
    tar xzf breakthrough_*_<os>_<arch>.tar.gz
    ./breakthrough
    ```

    Verify a download against `checksums.txt` with `sha256sum -c`.
  footer: |
    ---

    See [CONTRIBUTING.md](https://github.com/jagottsicher/breakthrough/blob/main/CONTRIBUTING.md)
    for the branch workflow, and [docs/whitepaper.md](https://github.com/jagottsicher/breakthrough/blob/main/docs/whitepaper.md)
    for the broader concept and vision.
